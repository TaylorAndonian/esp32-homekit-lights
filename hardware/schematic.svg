<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1240" height="760" fill="#ffffff"/>

  <style>
    .w   { stroke:#1f2937; stroke-width:2; fill:none; }
    .p5  { stroke:#dc2626; stroke-width:2.5; fill:none; }
    .gnd { stroke:#111827; stroke-width:2.5; fill:none; }
    .sig { stroke:#2563eb; stroke-width:2.5; fill:none; }
    .sw  { stroke:#059669; stroke-width:2.5; fill:none; }
    .ac  { stroke:#b45309; stroke-width:3; fill:none; }
    .acn { stroke:#475569; stroke-width:3; fill:none; }
    .box { fill:#f8fafc; stroke:#1f2937; stroke-width:2; }
    .t   { font-size:13px; fill:#111827; }
    .ts  { font-size:11px; fill:#374151; }
    .th  { font-size:15px; font-weight:bold; fill:#111827; }
    .pin { font-size:12px; fill:#111827; font-family: Menlo, Consolas, monospace; }
    .dot { fill:#111827; }
  </style>

  <!-- Title -->
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#111827">ESP32 HomeKit Lights — Wiring Schematic</text>
  <text x="30" y="62" class="ts">2 relay channels on GPIO 18 / 19 · 2 wall switches on GPIO 32 / 33 (internal pull-ups, switch to GND)</text>

  <!-- ================= MAINS ZONE ================= -->
  <rect x="955" y="95" width="265" height="540" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="968" y="118" font-size="14" font-weight="bold" fill="#b91c1c">DANGER: MAINS 120 VAC</text>
  <text x="968" y="134" class="ts" fill="#b91c1c">Enclosed, insulated, power OFF to work</text>

  <!-- ================= ESP32 ================= -->
  <rect x="420" y="170" width="200" height="410" rx="6" class="box"/>
  <text x="520" y="200" text-anchor="middle" class="th">ESP32 MiniKit</text>
  <text x="520" y="216" text-anchor="middle" class="ts">MH-ET LIVE · WROOM-32</text>
  <!-- right-side pins -->
  <text x="610" y="244" text-anchor="end" class="pin">VCC(5V)</text>
  <text x="610" y="284" text-anchor="end" class="pin">GND</text>
  <text x="610" y="344" text-anchor="end" class="pin">IO18</text>
  <text x="610" y="384" text-anchor="end" class="pin">IO19</text>
  <!-- left-side pins -->
  <text x="430" y="424" class="pin">IO32</text>
  <text x="430" y="494" class="pin">IO33</text>
  <text x="430" y="554" class="pin">GND</text>
  <!-- onboard LED note -->
  <text x="520" y="455" text-anchor="middle" class="ts">IO2 = onboard</text>
  <text x="520" y="469" text-anchor="middle" class="ts">status LED</text>
  <!-- USB -->
  <rect x="495" y="580" width="50" height="16" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
  <text x="520" y="592" text-anchor="middle" font-size="10" fill="#111827">USB</text>
  <line x1="520" y1="596" x2="520" y2="640" class="p5"/>
  <text x="520" y="658" text-anchor="middle" class="t">5 V USB supply, ≥ 1 A</text>
  <text x="520" y="674" text-anchor="middle" class="ts">(phone charger, or HLK-PM01 for a permanent install)</text>

  <!-- ================= RELAY 1 ================= -->
  <rect x="760" y="170" width="160" height="130" rx="6" class="box"/>
  <text x="840" y="160" text-anchor="middle" class="th">Relay 1 (Light 1)</text>
  <text x="840" y="292" text-anchor="middle" class="ts">Songle SRD-05VDC-SL-C</text>
  <text x="770" y="204" class="pin">+</text>
  <text x="770" y="234" class="pin">−</text>
  <text x="770" y="264" class="pin">S</text>
  <text x="910" y="204" text-anchor="end" class="pin">COM</text>
  <text x="910" y="234" text-anchor="end" class="pin">NO</text>
  <text x="910" y="264" text-anchor="end" class="pin">NC</text>

  <!-- ================= RELAY 2 ================= -->
  <rect x="760" y="390" width="160" height="130" rx="6" class="box"/>
  <text x="840" y="380" text-anchor="middle" class="th">Relay 2 (Light 2)</text>
  <text x="840" y="512" text-anchor="middle" class="ts">Songle SRD-05VDC-SL-C</text>
  <text x="770" y="424" class="pin">+</text>
  <text x="770" y="454" class="pin">−</text>
  <text x="770" y="484" class="pin">S</text>
  <text x="910" y="424" text-anchor="end" class="pin">COM</text>
  <text x="910" y="454" text-anchor="end" class="pin">NO</text>
  <text x="910" y="484" text-anchor="end" class="pin">NC</text>

  <!-- ===== 5V bus ===== -->
  <polyline points="620,240 690,240 690,200 760,200" class="p5"/>
  <polyline points="690,240 690,420 760,420" class="p5"/>
  <circle cx="690" cy="240" r="4" class="dot" fill="#dc2626"/>

  <!-- ===== GND bus ===== -->
  <polyline points="620,280 710,280 710,230 760,230" class="gnd"/>
  <polyline points="710,280 710,450 760,450" class="gnd"/>
  <circle cx="710" cy="280" r="4" class="dot"/>

  <!-- ===== Signals ===== -->
  <polyline points="620,340 735,340 735,260 760,260" class="sig"/>
  <polyline points="620,380 735,380 735,480 760,480" class="sig"/>

  <!-- ===== Switch 1 ===== -->
  <line x1="420" y1="420" x2="340" y2="420" class="sw"/>
  <circle cx="340" cy="420" r="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <line x1="340" y1="420" x2="294" y2="403" class="sw"/>
  <circle cx="290" cy="405" r="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <circle cx="290" cy="435" r="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="315" y="388" text-anchor="middle" class="t">SW1</text>
  <text x="352" y="412" class="ts">COM</text>
  <text x="282" y="450" text-anchor="end" class="ts">spare</text>
  <line x1="286" y1="405" x2="200" y2="405" class="gnd"/>

  <!-- ===== Switch 2 ===== -->
  <line x1="420" y1="490" x2="340" y2="490" class="sw"/>
  <circle cx="340" cy="490" r="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <line x1="340" y1="490" x2="294" y2="473" class="sw"/>
  <circle cx="290" cy="475" r="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <circle cx="290" cy="505" r="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="315" y="460" text-anchor="middle" class="t">SW2</text>
  <text x="352" y="482" class="ts">COM</text>
  <text x="282" y="520" text-anchor="end" class="ts">spare</text>
  <line x1="286" y1="475" x2="200" y2="475" class="gnd"/>

  <!-- switch GND rail -->
  <polyline points="200,405 200,550 420,550" class="gnd"/>
  <circle cx="200" cy="475" r="4" class="dot"/>
  <text x="60" y="350" class="t" font-weight="bold">Wall switches</text>
  <text x="60" y="368" class="ts">Single-pole 2-way (SPDT)</text>
  <text x="60" y="382" class="ts">LOW VOLTAGE ONLY (3.3 V)</text>
  <text x="60" y="396" class="ts">No mains on these wires</text>
  <text x="60" y="600" class="ts">Either flip direction toggles the light,</text>
  <text x="60" y="614" class="ts">so the switch and the Home app never fight.</text>

  <!-- ===== Mains: hot & neutral ===== -->
  <text x="1000" y="160" text-anchor="middle" class="t" font-weight="bold">L (hot)</text>
  <text x="1160" y="160" text-anchor="middle" class="t" font-weight="bold">N</text>
  <line x1="1000" y1="168" x2="1000" y2="420" class="ac"/>
  <line x1="1160" y1="168" x2="1160" y2="450" class="acn"/>
  <line x1="920" y1="200" x2="1000" y2="200" class="ac"/>
  <line x1="920" y1="420" x2="1000" y2="420" class="ac"/>
  <circle cx="1000" cy="200" r="4" fill="#b45309"/>

  <!-- Lamp 1 -->
  <line x1="920" y1="230" x2="1062" y2="230" class="ac"/>
  <circle cx="1080" cy="230" r="18" fill="#fffbeb" stroke="#1f2937" stroke-width="2"/>
  <line x1="1067" y1="217" x2="1093" y2="243" class="w"/>
  <line x1="1093" y1="217" x2="1067" y2="243" class="w"/>
  <line x1="1098" y1="230" x2="1160" y2="230" class="acn"/>
  <circle cx="1160" cy="230" r="4" fill="#475569"/>
  <text x="1080" y="270" text-anchor="middle" class="t">Light 1</text>

  <!-- Lamp 2 -->
  <line x1="920" y1="450" x2="1062" y2="450" class="ac"/>
  <circle cx="1080" cy="450" r="18" fill="#fffbeb" stroke="#1f2937" stroke-width="2"/>
  <line x1="1067" y1="437" x2="1093" y2="463" class="w"/>
  <line x1="1093" y1="437" x2="1067" y2="463" class="w"/>
  <line x1="1098" y1="450" x2="1160" y2="450" class="acn"/>
  <text x="1080" y="490" text-anchor="middle" class="t">Light 2</text>

  <text x="968" y="560" class="ts">NC terminals: not connected</text>
  <text x="968" y="576" class="ts">Relay switches the HOT wire only</text>
  <text x="968" y="592" class="ts">Lamp load ≤ 5 A per channel</text>
  <text x="968" y="608" class="ts">Fuse / breaker upstream</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(30,700)">
    <line x1="0" y1="0" x2="28" y2="0" class="p5"/><text x="36" y="4" class="ts">5 V</text>
    <line x1="80" y1="0" x2="108" y2="0" class="gnd"/><text x="116" y="4" class="ts">GND</text>
    <line x1="170" y1="0" x2="198" y2="0" class="sig"/><text x="206" y="4" class="ts">Relay signal</text>
    <line x1="300" y1="0" x2="328" y2="0" class="sw"/><text x="336" y="4" class="ts">Switch input</text>
    <line x1="430" y1="0" x2="458" y2="0" class="ac"/><text x="466" y="4" class="ts">AC hot</text>
    <line x1="530" y1="0" x2="558" y2="0" class="acn"/><text x="566" y="4" class="ts">AC neutral</text>
    <circle cx="660" cy="0" r="4" class="dot"/><text x="670" y="4" class="ts">junction (no dot = not connected)</text>
  </g>

  <!-- ===== Title block ===== -->
  <g transform="translate(955,655)">
    <rect width="265" height="80" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
    <text x="10" y="22" class="t" font-weight="bold">esp32-homekit-lights</text>
    <text x="10" y="42" class="ts">Author: Taylor Andonian</text>
    <text x="10" y="58" class="ts">Rev A · 2026-10-13</text>
    <text x="10" y="74" class="ts">Sheet 1 of 1</text>
  </g>
</svg>
